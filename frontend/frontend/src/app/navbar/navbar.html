<nav class="navbar">
  <a class="brand" routerLink="/store">
    <img class="brand-logo" src="beam-icon.svg" alt="Beam logo" width="30" height="30">
    Beam
  </a>

  <div class="links">
    <a routerLink="/store" routerLinkActive="active">Store</a>

    @if (loggedIn()) {
      <a routerLink="/library" routerLinkActive="active">Library</a>

      @if (role() === 'ADMIN') {
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      }
    }

    <a class="cart-link" routerLink="/cart" routerLinkActive="active" aria-label="Cart">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      @if (cart.count() > 0) {
        <span class="cart-badge">{{ cart.count() }}</span>
      }
    </a>

    @if (loggedIn()) {
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      <button class="btn btn-ghost btn-sm" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a class="btn btn-primary btn-sm" routerLink="/register">Register</a>
    }
  </div>
</nav>
