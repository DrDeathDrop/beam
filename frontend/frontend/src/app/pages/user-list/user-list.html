<div class="container">
  <h1>Users</h1>

  @if (loading()) {
    <p>Loading users...</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="user-grid">
    @for (user of users(); track user.id) {
      <div class="user-card">
        <h2>{{ user.name }}</h2>
        <p class="email">{{ user.email }}</p>
      </div>
    }
  </div>
</div>
