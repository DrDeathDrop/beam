<div class="container">
  @if (loading()) {
    <p class="muted">Loading profile…</p>
  }

  @if (user(); as u) {
    <div class="profile-card card">
      <div class="avatar">{{ u.name.charAt(0).toUpperCase() }}</div>
      <div class="who">
        <h1>{{ u.name }}</h1>
        <p class="email muted">{{ u.email }}</p>
      </div>
    </div>

    <div class="stats">
      <div class="stat card">
        <span class="stat-value">{{ owned().length }}</span>
        <span class="stat-label muted">Games owned</span>
      </div>
      <div class="stat card">
        <span class="stat-value">${{ totalSpent().toFixed(2) }}</span>
        <span class="stat-label muted">Total spent</span>
      </div>
      <a class="stat stat-link card" routerLink="/library">
        <span class="stat-value">→</span>
        <span class="stat-label">Open library</span>
      </a>
    </div>
  }
</div>
